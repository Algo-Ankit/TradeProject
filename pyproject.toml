[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Production-grade systematic algorithmic trading system for NSE India"
requires-python = ">=3.11"
authors = [{ name = "Ankit Anand Singh" }]
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "features*", "strategies*", "risk*", "execution*", "research*", "monitoring*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
